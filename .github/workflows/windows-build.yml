name: Build AzadiPOS Windows Installer

on:
  push:
    branches: [ electron ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js standalone
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000

      - name: Prepare standalone build
        shell: pwsh
        env:
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          Write-Host "=== PREPARING STANDALONE BUILD ===" -ForegroundColor Cyan
          
          # Verify standalone exists
          if (-not (Test-Path ".next/standalone/server.js")) {
            Write-Host "FATAL: .next/standalone/server.js not found" -ForegroundColor Red
            exit 1
          }
          Write-Host "Standalone build verified" -ForegroundColor Green
          
          # Copy static files
          New-Item -ItemType Directory -Force -Path ".next/standalone/.next/static" | Out-Null
          Copy-Item -Recurse -Force ".next/static/*" ".next/standalone/.next/static/"
          
          # Copy public folder
          New-Item -ItemType Directory -Force -Path ".next/standalone/public" | Out-Null
          Copy-Item -Recurse -Force "public/*" ".next/standalone/public/"
          
          # Copy prisma schema
          New-Item -ItemType Directory -Force -Path ".next/standalone/prisma" | Out-Null
          Copy-Item -Force "prisma/schema.prisma" ".next/standalone/prisma/"
          
          # CRITICAL: Copy Prisma client + query engine into standalone.
          # Next.js file tracing often misses the dynamically-loaded engine binary
          # (.dll.node on Windows), causing "Failed to create company" at runtime.
          $prismaClientSrc = "node_modules\.prisma"
          $prismaClientDst = ".next\standalone\node_modules\.prisma"
          if (Test-Path $prismaClientSrc) {
            New-Item -ItemType Directory -Force -Path $prismaClientDst | Out-Null
            Copy-Item -Recurse -Force "$prismaClientSrc\*" $prismaClientDst
            Write-Host "Prisma client + engine copied to standalone" -ForegroundColor Green
            
            # List engine files for verification
            $engines = Get-ChildItem -Recurse $prismaClientDst -Filter "*.node" -ErrorAction SilentlyContinue
            if ($engines) {
              Write-Host "Engine binaries found:" -ForegroundColor Green
              $engines | ForEach-Object { Write-Host "  $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }
            } else {
              Write-Host "WARNING: No .node engine binaries found in Prisma client!" -ForegroundColor Yellow
            }
          } else {
            Write-Host "WARNING: .prisma directory not found at $prismaClientSrc" -ForegroundColor Yellow
          }
          
          # Also copy @prisma/client if not already traced
          $atPrismaSrc = "node_modules\@prisma\client"
          $atPrismaDst = ".next\standalone\node_modules\@prisma\client"
          if ((Test-Path $atPrismaSrc) -and -not (Test-Path "$atPrismaDst\index.js")) {
            New-Item -ItemType Directory -Force -Path $atPrismaDst | Out-Null
            Copy-Item -Recurse -Force "$atPrismaSrc\*" $atPrismaDst
            Write-Host "@prisma/client copied to standalone" -ForegroundColor Green
          }
          
          # Create placeholder .env
          $envContent = "NEXTAUTH_SECRET=$env:AUTH_SECRET`nNEXTAUTH_URL=http://localhost:3000"
          $envContent | Out-File -FilePath ".next/standalone/.env" -Encoding ASCII
          
          Write-Host "Preparation complete!" -ForegroundColor Green

      - name: Build Installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show artifacts
        shell: pwsh
        run: |
          Write-Host "=== BUILD ARTIFACTS ===" -ForegroundColor Cyan
          Get-ChildItem "dist" -Filter "*.exe" | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $sizeMB MB" -ForegroundColor Green
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: azadipos-windows-installer
          path: dist/*.exe
          retention-days: 30
